<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Café Théâtre | La Carte</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3eee5;
            color: #33231d;
            font-family: 'Montserrat', sans-serif;
        }

        .hero {
            background: #2b1b17;
            color: #f5e5c8;
            text-align: center;
            padding: 65px 20px 55px;
            border-bottom: 3px solid #b89a63;
        }

        .small-title {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #cdb58a;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            font-weight: 500;
            margin: 20px 0 8px;
        }

        .line {
            width: 70px;
            height: 1px;
            background: #c9aa72;
            margin: 20px auto;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .content {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 13px;
            color: #75645a;
            line-height: 1.8;
        }

        .menu-card {
            background: #fffdf9;
            padding: 18px;
            border: 1px solid #d8c6a5;
            box-shadow: 0 8px 30px rgba(65, 42, 28, 0.08);
        }

        .menu-card img {
            display: block;
            width: 100%;
            height: auto;
        }

        .button {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: #2b1b17;
            color: #f5e5c8;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #b89a63;
            transition: 0.3s;
        }

        .button:hover {
            background: #b89a63;
            color: #2b1b17;
        }

        footer {
            background: #2b1b17;
            color: #cdb58a;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 48px;
            }

            .hero {
                padding: 50px 15px 40px;
            }

            .welcome h2 {
                font-size: 30px;
            }

            .content {
                margin-top: 30px;
            }

            .menu-card {
                padding: 10px;
            }

        }

    </style>

</head>

<body>

    <header class="hero">

        <div class="small-title">
            Bienvenue
        </div>

        <h1>Café Théâtre</h1>

        <div class="line"></div>

        <div class="subtitle">
            Café • Gastronomie • Élégance
        </div>

    </header>


    <main class="content">

        <section class="welcome">

            <h2>Notre Carte</h2>

            <p>
                Bienvenue au Café Théâtre.
                Découvrez nos saveurs dans une ambiance
                chaleureuse et raffinée.
            </p>

        </section>


        <section class="menu-card">

            <img
                src="download.png"
                alt="La carte du Café Théâtre"
            >

        </section>


        <a
            class="button"
            href="download.png"
            target="_blank"
        >
            Voir la carte en grand
        </a>

    </main>


    <footer>

        © 2026 Café Théâtre
        <br><br>
        L'élégance dans chaque détail.

    </footer>

</body>

</html>

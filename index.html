<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Café Théâtre - Menu</title>

    <style>
        body {
            font-family: Georgia, serif;
            background: #f5f0e6;
            color: #3b2418;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            font-weight: normal;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #3b2418;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>☕ Café Théâtre</h1>

        <h2>Notre Menu</h2>

        <p>Bienvenue au Café Théâtre !</p>

        <p>Découvrez notre menu ci-dessous.</p>

        <img src="download.png" alt="Menu du Café Théâtre">

        <br>

        <a class="button" href="download.png">
            Voir le menu en grand
        </a>

    </div>

</body>
</html>
